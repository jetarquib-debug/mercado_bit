{% load static %}
  <link rel="stylesheet" href="{% static 'barra_market/marcas_grid.css' %}">
<section class="marcas-grid marcas-slider">

  <div class="marcas-slider__wrap">
    <button class="marcas-btn marcas-prev" aria-label="Anterior">◀</button>
    <div class="marcas-slider__viewport">
      <div class="marcas-slider__track">
      {% for marca in marcas %}
        <div class="marca-slide">
          <div class="marca-slide__card">
              {% if marca.imagen_marca and marca.imagen_marca.url %}
                {% if query %}
                  <a class="marca-link" href="{% url 'producto:lista' %}?q={{ query|urlencode }}&marca={{ marca.pk }}" aria-label="{{ marca.nomb_marca }}">
                {% else %}
                  <a class="marca-link" href="{% url 'producto:lista' %}?marca={{ marca.pk }}" aria-label="{{ marca.nomb_marca }}">
                {% endif %}
                  <img src="{{ marca.imagen_marca.url }}" alt="{{ marca.nomb_marca }}" class="marca-slide__img">
                </a>
              {% else %}
                {% if query %}
                  <a class="marca-link" href="{% url 'producto:lista' %}?q={{ query|urlencode }}&marca={{ marca.pk }}" aria-label="{{ marca.nomb_marca }}">
                {% else %}
                  <a class="marca-link" href="{% url 'producto:lista' %}?marca={{ marca.pk }}" aria-label="{{ marca.nomb_marca }}">
                {% endif %}
                  <img src="{% static 'marcas_imagenes/default_marca.png' %}" alt="{{ marca.nomb_marca }}" class="marca-slide__img">
                </a>
              {% endif %}
          </div>
        </div>
      {% endfor %}
      </div>
    </div>
    <button class="marcas-btn marcas-next" aria-label="Siguiente">▶</button>
  </div>
</section>
<!-- Cargar el script directamente para asegurar que se ejecute incluso cuando la plantilla se incluye -->
<script src="{% static 'barra_market/marcas_slider.js' %}"></script>
