{% extends "home.html" %}
{% load static %}

{% block title %}Carrito de compras{% endblock title %}

{% block css %}
  <link rel="stylesheet" href="{% static 'carrito/carrito.css' %}">
{% endblock css %}

{% block content %}
<div class="carrito-page">
  <h1>Tu carrito</h1>
  <div class="carrito-container">
    <div id="cart-items" class="cart-items">
      <!-- Los items se renderizan por JS -->
    </div>
    <aside class="cart-summary">
      <div class="summary-card">
        <h3>Resumen</h3>
        <div class="summary-row"><span>Productos:</span> <span id="summary-count">0</span></div>
        <div class="summary-row"><span>Total:</span> <strong id="summary-total">S/. 0.00</strong></div>
        <div style="margin-top:1rem; display:flex; gap:0.5rem;">
          <button id="btn-checkout" class="btn primary">Pagar</button>
          <button id="btn-clear" class="btn">Vaciar</button>
        </div>
      </div>
    </aside>
  </div>
</div>
{% endblock content %}

{% block js %}
  <script src="{% static 'carrito/carrito.js' %}"></script>
{% endblock js %}
